# chat-cc 示例配置（复制到 ~/.chat-cc/config.yaml 后填写）

app_id: ""
app_secret: ""

# 默认 fail-closed。仅在明确需要公开机器人时设置 true。
allow_all_users: false
allowed_users: []
allowed_chats: []
admin_users: []

default_cwd: "."
projects: {}
allowed_cwd_roots: []

agent: "claude"
codex_bin: "codex"
codex_sandbox: "workspace-write"
codex_model: ""

claude_danger_mode: false
claude_allowed_tools:
  - "Read"
  - "Glob"
  - "Grep"

claude_ask_timeout_min: 50
claude_session_timeout_min: 50
max_concurrent_asks: 20
max_concurrent_asks_per_user: 2
max_concurrent_comment_queries: 10
max_active_sessions: 20
max_chunk_size: 3500
message_debounce_ms: 600
max_pending_messages_per_session: 100
max_pending_chars_per_session: 100000
stream_throttle_ms: 500

notify_chat_id: ""
notify_quiet_minutes: 2
notify_done_ping: true

idle_timeout_minutes: 30
idle_check_seconds: 60
approval_timeout_ms: 120000
mcp_feishu_rate_limit_ms: 10000
media_retention_days: 7

log_level: "info"
